name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "~1.13.0"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  terraform:
    name: Validate and test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add new modules here.
        module:
          - aws-backup-restore-drill
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Validate the module
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Run plan tests against a mocked provider
        run: terraform test
      - name: Validate the examples
        run: |
          for example in examples/*/; do
            echo "::group::$example"
            terraform -chdir="$example" init -backend=false -input=false
            terraform -chdir="$example" validate
            echo "::endgroup::"
          done

  lint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: Lint every module and example
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  security:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          config_file: .checkov.yaml
          quiet: true

  validator:
    name: Validator unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Modules that ship Python code.
        module:
          - aws-backup-restore-drill
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}/lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3 pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
